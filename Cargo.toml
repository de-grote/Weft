[workspace]
resolver = "3"
members = ["crates/*", "backends/*", "mods/*", "mods/base/api"]

[workspace.package]
version = "26.11.4"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.95"

[workspace.dependencies]
weft_abi = { path = "crates/abi" }
weft_sdk = { path = "crates/sdk" }
weft_noise = { path = "crates/noise" }
weft_render = { path = "crates/render" }
weft_engine = { path = "crates/engine" }
weft_vulkan = { path = "backends/vulkan" }
weft_wgpu = { path = "backends/wgpu" }
base_api = { path = "mods/base/api" }

ash = "0.38"
ash-window = "0.13"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "naga-ir"] }
pollster = "0.4"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
winit = "0.30"
raw-window-handle = "0.6"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
glam = { version = "0.34", features = ["bytemuck", "mint-05"] }
bytemuck = { version = "1", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
rayon = "1"
parking_lot = "0.13"
crossbeam-channel = "0.5"
libc = "0.2"
libloading = "0.9"
lz4_flex = "0.14"
png = "0.18"
rustc-hash = "2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
serde_json = "1"
# The mod catalog's downloads: certificates of its own, as a phone has none for Rust to read.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
sha2 = "0.11"
mimalloc = { version = "0.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
