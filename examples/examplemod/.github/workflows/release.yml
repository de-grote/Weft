# Builds your mod for Windows, Linux, macOS and Android phones and publishes one zip that works on
# all of them.
# You don't need any of those systems yourself: push a tag like v1.0.0 and download the result
# from your repository's Releases page.
#
# It works once this folder is the root of a repository of its own (GitHub only reads
# `.github/workflows` there), and `weft_sdk` in Cargo.toml points at the game's git repository
# instead of a path, with the tag of the game version your players run:
#   weft_sdk = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.10.2" }
# When the game updates, change that tag and push a new one of your own: a mod built for another
# game version refuses to load.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux: the oldest available, since a library only runs on this glibc or newer.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Mod name
        shell: bash
        run: echo "MOD=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      # Only the one this system built exists.
      - uses: actions/upload-artifact@v7
        with:
          name: library-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/${{ env.MOD }}.dll
            target/release/lib${{ env.MOD }}.so
            target/release/lib${{ env.MOD }}.dylib

  # 64-bit ARM phones, with the runner's Android NDK. The library has the Linux one's name, so it
  # goes in `android/` of the zip. A mod that can't build there (a C library without Android
  # support) can drop this job and its name from `needs` below.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          tc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android26-clang" \
            AR_aarch64_linux_android="$tc/llvm-ar" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android26-clang" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release --target aarch64-linux-android
          mod=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          mkdir -p out/android
          cp "target/aarch64-linux-android/release/lib$mod.so" out/android/

      - uses: actions/upload-artifact@v7
        with:
          name: library-android
          path: out
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: pack
          merge-multiple: true

      # The zip is named like the mod, which is what the game looks for. Players put it in their mods folder.
      - name: Pack and publish
        run: |
          mod=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          if [ -d assets ]; then cp -r assets pack/; fi
          (cd pack && zip -r "../$mod.zip" .)
          gh release create "$GITHUB_REF_NAME" "$mod.zip" --verify-tag --generate-notes
